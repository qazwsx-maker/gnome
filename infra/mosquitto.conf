# GNOME Mosquitto config (Homebrew mosquitto 2.x on the Mac mini)
# /opt/homebrew/etc/mosquitto/mosquitto.conf is a symlink to this file.
per_listener_settings false
allow_anonymous false
password_file /Users/pichaya/gnome/infra/mosquitto.passwd

# MQTT for nodes + gnome-core
listener 1883 0.0.0.0
protocol mqtt

# WebSockets for the browser dashboard (optional)
listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /Users/pichaya/gnome/infra/data/
autosave_interval 300

log_dest file /Users/pichaya/gnome/infra/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

max_queued_messages 1000
message_size_limit 65536
