; GnomeOS — firmware สำหรับ node ของ GNOME (ภูตดูแลสวน)
;   scout  = sensor node   (SHT3x / BH1750 / BME280 auto-detect, DHT22, soil ADC x6)
;   keeper = controller node (relay x1-4, max_on_time, interlock, failsafe)
; บอร์ดเป้าหมาย: ESP32 DevKit (ESP32-WROOM-32, 38 หรือ 30 ขา)
; หมายเหตุ: 2026-09-28 เครื่องนี้มี official platform 7.1.1 + Arduino core 2.0.17 ติดตั้งอยู่ (pioarduino stable ต้องการ PIO Core >=6.2) จึง pin 7.1.1

[platformio]
default_envs = scout, keeper, keeper-relayx4

[env]
platform = espressif32@7.1.1   ; official platform ที่ติดตั้งอยู่แล้ว (Arduino core 2.0.17) — pioarduino "stable" ต้องการ PIO Core >=6.2 ซึ่งเครื่องนี้ไม่มี
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv   ; app0/app1 1.9 MB ต่อ slot สำหรับ OTA (เปลี่ยนตารางนี้ต้อง flash ผ่าน USB เท่านั้น)
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3
    adafruit/Adafruit SHT31 Library@^2.2
    adafruit/Adafruit BME280 Library@^2.2
    adafruit/Adafruit Unified Sensor@^1.1
    adafruit/Adafruit BusIO@^1.16
    claws/BH1750@^1.3
    adafruit/DHT sensor library@^1.4
    olikraus/U8g2@^2.36
build_flags =
    -DGNOME_VERSION=\"0.3.0\"
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024

[env:scout]
build_flags = ${env.build_flags} -DGNOME_ROLE_SCOUT=1

[env:keeper]
build_flags = ${env.build_flags} -DGNOME_ROLE_KEEPER=1

; LC Technology ESP32-Relay-X4 (ESP32-WROOM-32E + relay 10A x4, ไฟเข้า 220VAC/7-30VDC/5VDC, ไม่มี USB → flash ผ่าน USB-TTL)
; relay1-4 = GPIO32/33/25/26 active HIGH · LED GPIO23 · OLED ต่อ I2C 21/22
[env:keeper-relayx4]
build_flags = ${env.build_flags} -DGNOME_ROLE_KEEPER=1 -DGNOME_BOARD_RELAYX4=1 -DGNOME_LED_PIN=23 -DGNOME_BOARD=\"esp32-relay-x4\"

; ESP32-S3 UNO (WROOM-1 N16R8) — Scout ตัวหลัก: I2C SDA 8 / SCL 9, ADC1 = IO1–IO10 (A0–A5 = IO2 IO1 IO7 IO6 IO5 IO4)
[env:scout-s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
lib_deps = ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12
build_flags = ${env.build_flags} -DGNOME_ROLE_SCOUT=1 -DGNOME_BOARD_S3UNO=1 -DGNOME_BOARD=\"esp32-s3-uno\" -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-C6-LCD-1.47 — ESP32-C6 ต้องใช้ Arduino core 3.x (pioarduino) → build ด้วย core dir แยก:
;   PLATFORMIO_CORE_DIR=$HOME/.platformio-c6 pio run -e scout-c6
; (ไม่ให้ toolchain 3.x ไปทับ framework 2.0.17 ของ env อื่น) · LCD ใช้ GPIO 6/7/14/15/21/22, SD 4-7, RGB LED GPIO8 · ADC1 = GPIO0-6
[env:scout-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.partitions = min_spiffs.csv
lib_deps = ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12
build_flags = ${env.build_flags} -DGNOME_ROLE_SCOUT=1 -DGNOME_BOARD_C6LCD=1 -DGNOME_BOARD=\"esp32-c6-lcd\" -DARDUINO_USB_CDC_ON_BOOT=1
