; GnomeOS — firmware สำหรับ node ของ GNOME (ภูตดูแลสวน)
;   scout  = sensor node   (SHT3x / BH1750 / BME280 auto-detect, DHT22, soil ADC x6)
;   keeper = controller node (relay x1-4, max_on_time, interlock, failsafe)
; บอร์ดเป้าหมาย: ESP32 DevKit (ESP32-WROOM-32, 38 หรือ 30 ขา)
; หมายเหตุ: 2026-09-28 เครื่องนี้มี official platform 7.1.1 + Arduino core 2.0.17 ติดตั้งอยู่ (pioarduino stable ต้องการ PIO Core >=6.2) จึง pin 7.1.1

[platformio]
default_envs = scout, keeper

[env]
platform = espressif32@7.1.1   ; official platform ที่ติดตั้งอยู่แล้ว (Arduino core 2.0.17) — pioarduino "stable" ต้องการ PIO Core >=6.2 ซึ่งเครื่องนี้ไม่มี
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3
    adafruit/Adafruit SHT31 Library@^2.2
    adafruit/Adafruit BME280 Library@^2.2
    adafruit/Adafruit Unified Sensor@^1.1
    adafruit/Adafruit BusIO@^1.16
    claws/BH1750@^1.3
    adafruit/DHT sensor library@^1.4
build_flags =
    -DGNOME_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024

[env:scout]
build_flags = ${env.build_flags} -DGNOME_ROLE_SCOUT=1

[env:keeper]
build_flags = ${env.build_flags} -DGNOME_ROLE_KEEPER=1
